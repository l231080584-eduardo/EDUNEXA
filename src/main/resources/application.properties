spring.application.name=enudexa
server.port=${PORT:8080}
server.servlet.context-path=/api/v1

spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=ENUDEXA_DB;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:Upiicsa1}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.datasource.hikari.maximum-pool-size=10

enudexa.ingestion.solo-tecnm=${INGESTION_SOLO_TECNM:false}
cors.allowed-origins=${CORS_ORIGIN:http://localhost:5173}
external.api.url=${EXTERNAL_API_URL:https://datos.cdmx.gob.mx/dataset/5a8518f0-6dc2-4403-9ad3-2864691de0d1/resource/a9004c49-027c-444d-a9f5-a82fe4208254/download/a9004c49-027c-444d-a9f5-a82fe4208254.json}
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
