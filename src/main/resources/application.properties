spring.application.name=edunexa
server.port=${PORT:8080}
server.servlet.context-path=/api/v1
server.forward-headers-strategy=framework

# SQL Server is used for local runs and Docker.
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=EDUNEXA_DB;encrypt=false;trustServerCertificate=true}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

enudexa.ingestion.enabled=${INGESTION_ENABLED:true}
enudexa.ingestion.solo-tecnm=${INGESTION_SOLO_TECNM:false}
cors.allowed-origins=${CORS_ORIGIN:http://localhost:5173,http://localhost:80,http://localhost}
external.api.url=${EXTERNAL_API_URL:https://sic.gob.mx/opendata/d/0_universidad_directorio.json}
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
